<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --card:#f9fafb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111827; --fg:#f3f4f6; --muted:#9ca3af; --line:#374151; --accent:#60a5fa; --card:#1f2937; }
  }
  * { box-sizing: border-box; }
  body { margin:0; width:300px; font:13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; }
  section { padding:12px 16px; border-bottom:1px solid var(--line); }
  label.row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .muted { color:var(--muted); font-size:12px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  select { width:100%; padding:5px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  .switch { position:relative; width:40px; height:22px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:#9ca3af; border-radius:22px; cursor:pointer; transition:.15s; }
  .slider:before { content:""; position:absolute; width:18px; height:18px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + .slider { background:var(--accent); }
  .switch input:checked + .slider:before { transform:translateX(18px); }
  #status { background:var(--card); border-radius:8px; padding:8px 10px; }
  .vid { display:flex; justify-content:space-between; gap:8px; }
  .vid + .vid { margin-top:4px; }
  .ok { color:#16a34a; } .warn { color:#d97706; }
  kbd { font:11px ui-monospace, monospace; border:1px solid var(--line); border-radius:4px; padding:0 4px; }
</style>
</head>
<body>
  <header>
    <h1>Video Upscaler</h1>
    <label class="switch" title="Turn upscaling on/off">
      <input type="checkbox" id="enabled"><span class="slider"></span>
    </label>
  </header>
  <section>
    <label class="row" for="sharpness"><span>Sharpness</span><span id="sharpVal" class="muted"></span></label>
    <input type="range" id="sharpness" min="0" max="100" step="5">
  </section>
  <section>
    <label class="row" for="maxRes"><span>Max output resolution</span></label>
    <select id="maxRes">
      <option value="1080">1080p (lightest on battery)</option>
      <option value="1440">1440p</option>
      <option value="2160">4K</option>
      <option value="2880">5K (best quality)</option>
    </select>
  </section>
  <section>
    <div id="status" class="muted">Checking this tab…</div>
  </section>
  <section class="muted">
    Before/after: press <kbd>⌥ Option</kbd>+<kbd>⇧ Shift</kbd>+<kbd>U</kbd> on the video page.
  </section>
  <script src="popup.js"></script>
</body>
</html>
